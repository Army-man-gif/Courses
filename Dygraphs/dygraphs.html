<html>    
    <head>
    <script 
        type="text/javascript"
        src="dygraph.js">
    </script>
    <link 
        rel="stylesheet" 
        type="text/css"
        href="dygraph.css" 
    />
</head>
<body>
    <div 
        id="graphdiv"
        style="width:500px; height:300px;">
    </div>
    <script type="text/javascript">
        Dygraph.onDOMready(function onDOMready() {
            g2 = new Dygraph(
                document.getElementById("graphdiv"),
                "temperatures.csv",
                {
                    resizable:"both",
                    //showRangeSelector: true,
                    rollPeriod: 7,
                    //showRoller: true,
                    series : {
                        "High" : {
                            axis: 'y1'
                        },
                        "Low" : {
                            axis : 'y2'
                        }
                    }
                }
            );
        });
    </script>
</body>
</html>
