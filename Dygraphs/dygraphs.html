<html>    
    <head>
    <script 
        type="text/javascript"
        src="dygraph.js">
    </script>
    <link 
        rel="stylesheet" 
        type="text/css"
        href="dygraph.css" 
    />
</head>
<body>
    <div 
        id="graphdiv"
        style="width:500px; height:300px;">
    </div>
    <script type="text/javascript">
        Dygraph.onDOMready(function onDOMready() {
            g2 = new Dygraph(
                document.getElementById("graphdiv"),
                "temperatures.csv",
                {
                    resizable:"both",
                    //showRangeSelector: true,
                    rollPeriod: 7,
                    //showRoller: true,
                    series : {
                        "High" : {
                            axis: 'y1'
                        },
                        "Low" : {
                            axis : 'y2'
                        }
                    },
                    xlabel : "Date",
                    ylabel : "High Temperature (⁰F)",
                    y2label : "Low Temperature (⁰F)",
                    axes : {
                        x : {
                            axisLabelFormatter : function(val, granularity, opts, dygraph){
                                return val.getFullYear();
                            },
                            axisLineColor : 'green',
                            axisLabelFontSize: 16
                        },
                        y : {
                            axisLabelFormatter : function(val, granularity, opts, dygraph){
                                return Math.round(val) + " ⁰F";
                            },
                            axisLineColor : 'orange',
                            axisLabelFontSize : 14
                        },
                        y2 : {
                            axisLabelFormatter : function(val, granularity, opts, dygraph){
                                return Math.round(val) + " ⁰F";
                            },
                            axisLineColor : 'purple',
                            axisLabelFontSize : 12
                        }
                    }
                }
            );
        });
    </script>
</body>
</html>
